{% if notes %}
  <div class="space-y-3">
    {% for item in notes | reverse %}
      <div class="rounded-xl border border-slate-100 bg-slate-50 p-4">
        <div class="flex items-center justify-between gap-4">
          <p class="text-sm font-semibold text-slate-900">{{ item.author }}</p>
          <p class="text-xs text-slate-500">{{ item.timestamp }}</p>
        </div>
        <p class="mt-3 text-sm leading-6 text-slate-700">{{ item.note }}</p>
      </div>
    {% endfor %}
  </div>
{% else %}
  <div class="rounded-xl border border-dashed border-slate-200 bg-slate-50 p-6 text-center text-sm text-slate-500">
    No HR notes yet for this employee.
  </div>
{% endif %}
