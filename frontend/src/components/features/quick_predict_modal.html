<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4">
  <div class="absolute inset-0" data-modal-close aria-label="Close quick predict modal"></div>
  <div class="relative z-10 max-h-[92vh] w-full max-w-5xl overflow-auto rounded-3xl bg-white shadow-2xl">
    <div class="sticky top-0 z-10 flex items-center justify-between border-b border-slate-100 bg-white px-6 py-5">
      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">Quick Predict</p>
        <h3 class="text-xl font-bold text-slate-900">Run an attrition check without leaving the dashboard</h3>
      </div>
      <button type="button" aria-label="Close quick predict modal" data-modal-close class="rounded-lg border border-slate-200 p-2 text-slate-600 transition-all duration-200 hover:bg-slate-100">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" class="h-5 w-5 stroke-[1.8]">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 6 18 18M18 6 6 18"/>
        </svg>
      </button>
    </div>
    <div class="grid gap-6 p-6 xl:grid-cols-[1.05fr,0.95fr]">
      <section class="rounded-xl border border-slate-100 bg-white">
        {% include "components/features/predict_form.html" %}
      </section>
      <section class="rounded-xl border border-slate-100 bg-slate-50 p-5">
        <h4 class="text-lg font-semibold text-slate-900">Live Result</h4>
        <p class="text-sm text-slate-500">The modal result card updates in place after the HTMX request completes.</p>
        <div id="prediction-result-modal" class="mt-5">
          <div class="rounded-xl border border-dashed border-slate-200 bg-white p-8 text-center">
            <p class="text-sm text-slate-500">Submit the form to see the risk badge, probability gauge, and HR recommendations.</p>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
