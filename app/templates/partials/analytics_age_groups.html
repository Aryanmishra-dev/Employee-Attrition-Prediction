<div>
  <h3 class="text-lg font-semibold text-slate-900">Age Group vs Attrition Probability</h3>
  <p class="text-sm text-slate-500">Grouped comparison of predicted probability against actual attrition rate.</p>
  <div class="mt-6 h-80">
    <canvas id="analytics-age-groups-chart" aria-label="Age group attrition chart"></canvas>
  </div>
</div>
<script>
  (function () {
    const payload = {{ payload | tojson }};
    AttritionApp.renderChart("analytics-age-groups-chart", {
      type: "bar",
      data: {
        labels: payload.labels,
        datasets: [
          {
            label: "Predicted probability (%)",
            data: payload.predicted,
            backgroundColor: "#4338CA",
            borderRadius: 10
          },
          {
            label: "Actual attrition rate (%)",
            data: payload.actual,
            backgroundColor: "#10B981",
            borderRadius: 10
          }
        ]
      },
      options: {
        maintainAspectRatio: false,
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
  })();
</script>
