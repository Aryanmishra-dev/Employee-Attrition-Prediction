services:
  - type: web
    name: employee-attrition-prediction
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_RUNTIME_DATA_DIR
        value: /app/app/data
      - key: APP_MAX_UPLOAD_BYTES
        value: 2000000
      - key: APP_MAX_BATCH_ROWS
        value: 5000
      - key: APP_ALLOWED_HOSTS
        sync: false
      - key: APP_ALLOWED_ORIGINS
        sync: false
      - key: APP_AUTH_TOKEN
        sync: false
      - key: APP_AUTH_USERNAME
        sync: false
      - key: APP_AUTH_PASSWORD
        sync: false
      - key: HIGH_RISK_THRESHOLD
        sync: false
      - key: MEDIUM_RISK_THRESHOLD
        sync: false
